name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/apps/catat-uang
            git fetch origin main
            git reset --hard origin/main
            docker run --rm -v $(pwd):/app -w /app node:22-alpine sh -c "npm ci && npm run build"
            docker compose up -d --build
            docker compose exec -T catat-uang-app composer install --no-dev --optimize-autoloader
            docker compose exec -T catat-uang-app php artisan migrate --force
            docker compose exec -T catat-uang-app chown -R www-data:www-data storage bootstrap/cache public/build
            docker compose exec -T catat-uang-app chmod -R 775 storage bootstrap/cache
            docker compose exec -T catat-uang-app php artisan optimize:clear
            docker image prune -f
